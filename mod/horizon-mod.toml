id = "tiktok_live"
name = "TikTok LIVE"
version = "0.1.0"
description = "Connects TikTok LIVE creators and turns their events into in-game actions."
authors = ["nglmercer"]
license = "MIT"
# A native mod: Rust in src/, compiled by the launcher against the game build [native] pins.
api = "0.2"
# The mod registers content that every client needs, so it declares "both". Its server hooks
# do nothing on a client. Clients and server must be built from the same source (same mod hash).
side = "both"
capabilities = ["registries"]

# Pinned to upstream horizon-rust/horizon's published SDK (see .github/workflows/ci.yml).
# Migration history and the verification runbook: docs/UPSTREAM-MIGRATION.md.
[native]
game = "26.3"
horizon = "0b14f8acfd97fa2c750e42795249dcc981178ca4"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"
